<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Daily Calorie Intake — BiteLens Progress Tracker</title>
  <meta name="description" content="Track your daily calorie intake, view goal rings, and monitor weekly nutrition habits with BiteLens." />
  <link rel="canonical" href="https://nutribite-cvg1.onrender.com/progress.html" />
  <!-- TODO: update after domain migration -->
  <meta property="og:title" content="Your Daily Calorie Intake — BiteLens Progress Tracker" />
  <meta property="og:description" content="Track your calories, view progress rings, and log daily nutrition with BiteLens." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nutribite-cvg1.onrender.com/progress.html" />
  <!-- TODO: update after domain migration -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css?v=3.7" />
</head>
<body class="page-bg">
  <div id="chrome"></div>
  <main class="container page">
    <div class="page-head">
      <h1>Your daily calorie intake</h1>
      <p>Every scan is added to the day you ate it — Day 1, Day 2, Day 3 and on.</p>
    </div>

    <div class="sum-grid" id="summary"></div>

    <div class="panel">
      <h3 style="font-size:1.2rem;letter-spacing:-.02em;margin-bottom:6px">Last 7 days</h3>
      <div class="chart" id="chart"></div>
    </div>

    <div class="toolbar">
      <h2>All days</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <div class="goal-ctrl"><label for="goal">Daily goal</label><input type="number" id="goal" min="800" max="6000" step="50" /><button class="btn btn-dark btn-sm" id="saveGoal">Save</button></div>
        <button class="btn btn-light btn-sm btn-danger" id="clearBtn">Clear history</button>
      </div>
    </div>
    <div class="days" id="days"></div>
  </main>

  <script src="countup.js?v=3.5"></script>
  <script src="common.js?v=3.5"></script>
  <script>NB.mountChrome("progress");</script>
  <script src="progress.js"></script>
</body>
</html>
