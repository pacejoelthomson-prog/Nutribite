services:
  - type: web
    name: nutribite
    runtime: node
    plan: free
    buildCommand: npm install --production
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        value: gemini-3.5-flash,gemini-3.7-flash,gemini-3.8-flash,gemini-flash-latest
