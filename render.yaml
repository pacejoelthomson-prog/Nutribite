services:
  - type: web
    name: bitelens
    runtime: node
    plan: free
    buildCommand: npm install --production
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        value: gemini-3.5-flash,gemini-3.6-flash,gemini-3.1-flash-lite,gemini-flash-latest
