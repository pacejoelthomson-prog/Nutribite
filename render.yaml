services:
  - type: web
    name: nutribite
    runtime: node
    plan: free
    buildCommand: npm install --production
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODELS
        value: google/gemini-2.5-flash,openai/gpt-4o-mini
